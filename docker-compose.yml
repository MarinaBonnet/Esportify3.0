services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: esportify_php

    working_dir: /var/www

    volumes:
      - ./symfony:/var/www

    depends_on:
      - mysql
      - mongo

  nginx:
    image: nginx:latest
    container_name: esportify_nginx

    ports:
      - "8000:80"

    volumes:
      - ./symfony:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - php

  mysql:
    image: mysql:8.0
    container_name: esportify_mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: esportify
      MYSQL_USER: esportify
      MYSQL_PASSWORD: Esportify3.02026

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  mongo:
    image: mongo:latest
    container_name: esportify_mongo

    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

volumes:
  mysql_data:
  mongo_data:
